name: Refresh Instagram Data

on:
  schedule:
    # Täglich um 03:00 UTC (~05:00 Wien)
    - cron: "0 3 * * *"
  workflow_dispatch:  # Manuell auslösbar

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # ───────── Profile 1: C& (@contemporaryand) ─────────
      - name: Fetch data for C&
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN_1 }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID_1 }}
          AD_ACCOUNT_ID: ${{ secrets.AD_ACCOUNT_ID }}
        run: python fetch_data.py

      # ───────── Profile 2: C&Latin (@contemporaryand.americalatina) ─────────
      - name: Fetch data for C&Latin
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN_2 }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID_2 }}
          AD_ACCOUNT_ID: ${{ secrets.AD_ACCOUNT_ID }}
        run: python fetch_data.py

      # ───────── Commit beider Profile in einem Push ─────────
      - name: Commit & push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: refresh Instagram data ($(date -u +%Y-%m-%d))"
            git push
          fi
