name: Fetch Instagram Data

on:
  schedule:
    - cron: '0 4 * * *' # Läuft täglich um 04:00 Uhr UTC
  workflow_dispatch:    # Erlaubt das manuelle Starten über den GitHub-Button

jobs:
  fetch-data:
    runs-on: ubuntu-latest
    
    # Zwingend erforderlich für den fehlerfreien Git Push (Schreibrechte)
    permissions:
      contents: write
    
    strategy:
      # Verhindert Speicher-Konflikte, indem die Accounts nacheinander verarbeitet werden
      max-parallel: 1
      matrix:
        # Hier definieren wir die beiden Accounts
        account: [account_1, account_2]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip' # Beschleunigt zukünftige Durchläufe

      - name: Install Dependencies
        run: pip install requests pandas

      - name: Run fetch_data.py for ${{ matrix.account }}
        run: python fetch_data.py
        env:
          # Dynamische Zuweisung der Secrets je nach Account
          INSTAGRAM_USER_ID: ${{ matrix.account == 'account_1' && secrets.INSTAGRAM_USER_ID_1 || secrets.INSTAGRAM_USER_ID_2 }}
          INSTAGRAM_ACCESS_TOKEN: ${{ matrix.account == 'account_1' && secrets.INSTAGRAM_ACCESS_TOKEN_1 || secrets.INSTAGRAM_ACCESS_TOKEN_2 }}

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          
          # Speichert die Änderungen lokal, bricht aber nicht ab, falls es keine gibt
          git commit -m "Update Instagram data for ${{ matrix.account }}" || echo "No changes to commit"
          
          # NEU: Zieht sich den aktuellsten Stand aus dem Repository (wichtig für Account 2)
          git pull --rebase origin main
          
          # Schiebt die fertigen Dateien ins Repository
          git push

          - name: Fetch Ads Marketing API Data
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          AD_ACCOUNT_ID: ${{ secrets.AD_ACCOUNT_ID }}
        run: python fetch_ads_data.py

      - name: Process Collabs and Calculate ROI
        run: python process_collabs_and_roi.py
