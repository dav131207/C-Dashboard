name: Fetch Instagram Data

on:
  schedule:
    - cron: '0 4 * * *' # Läuft täglich um 04:00 Uhr
  workflow_dispatch:    # Erlaubt das manuelle Starten über den GitHub-Button

jobs:
  fetch-data:
    runs-on: ubuntu-latest
    
    # Hier definieren wir die beiden Accounts als Matrix
    strategy:
      matrix:
        account: [account_1, account_2]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        # Füge hier deine benötigten Bibliotheken ein (z.B. requests, pandas)
        run: pip install requests pandas

      - name: Run fetch_data.py for ${{ matrix.account }}
        run: python fetch_data.py
        env:
          # Hier weisen wir die passenden Secrets dynamisch zu!
          INSTAGRAM_USER_ID: ${{ matrix.account == 'account_1' && secrets.INSTAGRAM_USER_ID_1 || secrets.INSTAGRAM_USER_ID_2 }}
          INSTAGRAM_ACCESS_TOKEN: ${{ matrix.account == 'account_1' && secrets.INSTAGRAM_ACCESS_TOKEN_1 || secrets.INSTAGRAM_ACCESS_TOKEN_2 }}

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Update Instagram data for ${{ matrix.account }}" || echo "No changes to commit"
          git push
