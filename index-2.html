// ─────────────────────────────────────────────────────────────────────────
// Modal — drill-in for metric or post
// ─────────────────────────────────────────────────────────────────────────
function Modal({ open, onClose, children, wide }) {
  React.useEffect(() => {
    const onKey = (e) => { if (e.key === 'Escape') onClose(); };
    if (open) document.addEventListener('keydown', onKey);
    return () => document.removeEventListener('keydown', onKey);
  }, [open, onClose]);
  if (!open) return null;
  return (
    <div className="modal-scrim" onClick={onClose}>
      <div className={`modal ${wide ? 'wide' : ''}`} onClick={(e) => e.stopPropagation()}>
        <button className="modal-close" onClick={onClose} aria-label="Close">✕</button>
        {children}
      </div>
    </div>
  );
}

function MetricDrill({ metric, profile, profiles, range, dates, accent, accent2 }) {
  const labels = {
    followers:      { title: 'Followers',       sub: 'Total community size over time', unit: '' },
    reach:          { title: 'Reach',           sub: 'Unique accounts that saw your content', unit: '' },
    impressions:    { title: 'Impressions',     sub: 'Total times content was rendered', unit: '' },
    engagement:     { title: 'Engagement',      sub: 'Likes, comments, saves, shares combined', unit: '' },
    profile_views:  { title: 'Profile Visits',  sub: 'Visits to the profile page', unit: '' },
    website_clicks: { title: 'Website Clicks',  sub: 'Taps on the website link in bio', unit: '' },
  };
  const meta = labels[metric];
  const slice = sliceSeries(profile.series[metric], dates, range);
  const total = sum(slice.values);
  const avg = total / slice.values.length;
  const max = Math.max(...slice.values);
  const maxDate = slice.dates[slice.values.indexOf(max)];

  // Compare with other profile
  const other = Object.values(profiles).find(p => p.id !== profile.id);
  const otherSlice = sliceSeries(other.series[metric], dates, range);
  const otherTotal = sum(otherSlice.values);

  return (
    <div className="drill">
      <div className="drill-head">
        <span className="drill-eyebrow">{profile.handle} · metric</span>
        <h2 className="drill-title">{meta.title}</h2>
        <p className="drill-sub">{meta.sub}</p>
      </div>
      <div className="drill-stats">
        <div><span className="ds-l">Total</span><span className="ds-v">{fmt(total)}</span></div>
        <div><span className="ds-l">Daily avg.</span><span className="ds-v">{fmt(Math.round(avg))}</span></div>
        <div><span className="ds-l">Peak day</span><span className="ds-v">{fmt(max)} <em>· {fmtDateShort(maxDate)}</em></span></div>
        <div><span className="ds-l">{other.handle.replace('@','')}</span><span className="ds-v">{fmt(otherTotal)}</span></div>
      </div>
      <div className="drill-chart">
        <LineChart values={slice.values} dates={slice.dates} accent={accent} style="area" height={280} />
      </div>
      <div className="drill-foot">
        <span className="df-l">Compare</span>
        <div className="df-cmp">
          <div className="df-bar"><span className="df-bar-l">{profile.handle}</span><span className="df-bar-track"><span className="df-bar-fill" style={{ width: `${Math.min(100, (total / Math.max(total, otherTotal)) * 100)}%`, background: accent }} /></span><span className="df-bar-v">{fmt(total)}</span></div>
          <div className="df-bar"><span className="df-bar-l">{other.handle}</span><span className="df-bar-track"><span className="df-bar-fill" style={{ width: `${Math.min(100, (otherTotal / Math.max(total, otherTotal)) * 100)}%`, background: accent2 }} /></span><span className="df-bar-v">{fmt(otherTotal)}</span></div>
        </div>
      </div>
    </div>
  );
}

function PostDrill({ post, profile, accent }) {
  const engagement = post.likes + post.comments + post.saves + post.shares;
  const rate = (engagement / post.reach) * 100;
  // Mock minute-by-minute reach curve for the post
  const curve = [];
  for (let i = 0; i < 48; i++) {
    const t = i / 47;
    const v = post.reach * (1 - Math.exp(-t * 3.4)) * (1 + Math.sin(t * 7) * 0.04);
    curve.push(Math.round(v));
  }
  const hourLabels = curve.map((_, i) => `${i}h`);

  return (
    <div className="drill">
      <div className="post-drill-head">
        <div className={`pdh-media ${post.thumbnail ? 'has-image' : ''}`} style={post.thumbnail
          ? { backgroundImage: `url(${post.thumbnail})`, backgroundSize: 'cover', backgroundPosition: 'center', backgroundColor: post.swatch }
          : { background: post.swatch }}>
          <span className="pc-type"><span style={{ textTransform: 'capitalize' }}>{post.type}</span></span>
          {post.type === 'reel' && <span className="pc-duration">{post.duration}s</span>}
          {post.type === 'carousel' && <span className="pc-duration">{post.slides} slides</span>}
        </div>
        <div className="pdh-text">
          <span className="drill-eyebrow">{profile.handle} · {fmtDate(post.date)}</span>
          <h2 className="drill-title">{post.title}</h2>
          <div className="pdh-stats">
            <div><em>Reach</em><strong>{fmt(post.reach)}</strong></div>
            <div><em>Likes</em><strong>{fmt(post.likes)}</strong></div>
            <div><em>Comments</em><strong>{fmt(post.comments)}</strong></div>
            <div><em>Saves</em><strong>{fmt(post.saves)}</strong></div>
            <div><em>Shares</em><strong>{fmt(post.shares)}</strong></div>
            {post.plays && <div><em>Plays</em><strong>{fmt(post.plays)}</strong></div>}
            <div><em>Engagement rate</em><strong>{rate.toFixed(2)}%</strong></div>
          </div>
          {post.url && (
            <a className="ig-link" href={post.url} target="_blank" rel="noopener noreferrer">
              <svg width="14" height="14" viewBox="0 0 16 16"><rect x="2" y="2" width="12" height="12" rx="3" fill="none" stroke="currentColor" strokeWidth="1.3"/><circle cx="8" cy="8" r="2.6" fill="none" stroke="currentColor" strokeWidth="1.3"/><circle cx="11.5" cy="4.5" r="0.7" fill="currentColor"/></svg>
              Open on Instagram
              <span className="ig-link-url">{post.url.replace('https://www.instagram.com', '')}</span>
            </a>
          )}
        </div>
      </div>
      <div className="drill-chart">
        <div className="drill-chart-title">Reach over the first 48 hours</div>
        <LineChart values={curve} dates={hourLabels} accent={accent} style="area" height={200} />
      </div>
    </div>
  );
}

// ────────────────────────────────────────────────────────────────────────
// Best Time drill — zoomed heatmap with numeric cells + top windows
// ────────────────────────────────────────────────────────────────────────
function BestTimeDrill({ profile, accent, accent2, data }) {
  const grid = data.bestTime[profile.id];
  const days = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
  const dayFull = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];
  const max = Math.max(...grid.flat());
  const [hover, setHover] = React.useState(null);
  const [showValues, setShowValues] = React.useState(true);

  // Top 5 windows
  const flat = [];
  grid.forEach((row, d) => row.forEach((v, h) => flat.push({ d, h, v })));
  flat.sort((a, b) => b.v - a.v);
  const topFive = flat.slice(0, 5);

  // Aggregates
  const byDay = grid.map((row, d) => ({ d, total: row.reduce((s, v) => s + v, 0), avg: row.reduce((s, v) => s + v, 0) / 24 }));
  const byHour = Array.from({ length: 24 }, (_, h) => ({ h, total: grid.reduce((s, row) => s + row[h], 0), avg: grid.reduce((s, row) => s + row[h], 0) / 7 }));
  const maxDay = Math.max(...byDay.map(d => d.avg));
  const maxHour = Math.max(...byHour.map(h => h.avg));

  return (
    <div className="drill bt-drill">
      <div className="drill-head">
        <span className="drill-eyebrow">{profile.handle} · best time to post</span>
        <h2 className="drill-title">When to publish</h2>
        <p className="drill-sub">Engagement index normalized 0–100 by weekday × hour, local CET. Higher values = better historical performance.</p>
      </div>

      <div className="bt-drill-controls">
        <button className={`chip ${showValues ? 'on' : ''}`} onClick={() => setShowValues(v => !v)}>
          {showValues ? 'Hide values' : 'Show values'}
        </button>
        <div className="bt-legend">
          <span className="bt-legend-l">Low</span>
          <span className="bt-legend-grad" style={{ background: `linear-gradient(to right, ${accent}11, ${accent})` }} />
          <span className="bt-legend-l">High</span>
        </div>
      </div>

      <div className="bt-zoom" onMouseLeave={() => setHover(null)}>
        <div className="btz-hours">
          <span className="btz-corner" />
          {Array.from({ length: 24 }, (_, h) => (
            <span key={h} className={`btz-h-l ${hover && hover.h === h ? 'on' : ''}`}>{h.toString().padStart(2, '0')}</span>
          ))}
        </div>
        {grid.map((row, d) => (
          <div key={d} className="btz-row">
            <span className={`btz-day ${hover && hover.d === d ? 'on' : ''}`}>{days[d]}</span>
            {row.map((v, h) => {
              const op = 0.06 + (v / max) * 0.94;
              const isHover = hover && hover.d === d && hover.h === h;
              const isTop = topFive.find(t => t.d === d && t.h === h);
              return (
                <button
                  key={h}
                  className={`btz-cell ${isHover ? 'on' : ''} ${isTop ? 'top' : ''}`}
                  style={{ background: accent, opacity: op }}
                  onMouseEnter={() => setHover({ d, h, v })}
                >
                  {showValues && <span className="btz-val" style={{ color: op > 0.55 ? 'white' : 'currentColor' }}>{v}</span>}
                  {isTop && <span className="btz-top-mark" style={{ background: accent2 }}>{topFive.findIndex(t => t.d === d && t.h === h) + 1}</span>}
                </button>
              );
            })}
          </div>
        ))}
      </div>

      <div className="bt-readout-bar">
        {hover ? (
          <>
            <div><span className="ds-l">Day</span><span className="ds-v">{dayFull[hover.d]}</span></div>
            <div><span className="ds-l">Hour</span><span className="ds-v">{hover.h.toString().padStart(2, '0')}:00 – {(hover.h + 1).toString().padStart(2, '0')}:00</span></div>
            <div><span className="ds-l">Index</span><span className="ds-v" style={{ color: accent }}>{hover.v}</span></div>
            <div><span className="ds-l">vs. avg</span><span className="ds-v">{((hover.v / (max / 2)) * 100 - 100).toFixed(0)}%</span></div>
          </>
        ) : (
          <div className="bt-readout-hint">Hover any cell to inspect — ranked windows are marked in blue.</div>
        )}
      </div>

      <div className="bt-grid-2">
        <div className="bt-side">
          <h3 className="bt-side-title">Top 5 windows</h3>
          <ol className="bt-top-list">
            {topFive.map((t, i) => (
              <li key={i}>
                <span className="bt-top-rank" style={{ background: accent2 }}>{i + 1}</span>
                <span className="bt-top-when">{dayFull[t.d]} · {t.h.toString().padStart(2, '0')}:00</span>
                <span className="bt-top-val">{t.v}</span>
              </li>
            ))}
          </ol>
        </div>
        <div className="bt-side">
          <h3 className="bt-side-title">By weekday</h3>
          <ul className="bt-bars">
            {byDay.map((d, i) => (
              <li key={i}>
                <span className="bt-bar-l">{dayFull[d.d]}</span>
                <span className="bt-bar-track"><span className="bt-bar-fill" style={{ width: `${(d.avg / maxDay) * 100}%`, background: accent }} /></span>
                <span className="bt-bar-v">{Math.round(d.avg)}</span>
              </li>
            ))}
          </ul>
        </div>
        <div className="bt-side">
          <h3 className="bt-side-title">By hour</h3>
          <div className="bt-hour-row">
            {byHour.map((h, i) => (
              <div key={i} className="bt-hour-col" title={`${h.h.toString().padStart(2,'0')}:00 · avg ${Math.round(h.avg)}`}>
                <span className="bt-hour-bar" style={{ height: `${(h.avg / maxHour) * 100}%`, background: accent }} />
                {(i % 3 === 0) && <span className="bt-hour-l">{h.h.toString().padStart(2,'0')}</span>}
              </div>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
}

  DemographicsPanel, BestTimePanel, HashtagsPanel, TopPostsPanel,

});

</script>

<script type="text/babel" data-presets="react">
function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const D = window.DASHBOARD_DATA;

  const [profileId, setProfileId] = React.useState('main');
  const [range, setRange] = React.useState({ start: '2026-04-20', end: '2026-05-18' });
  const [refreshing, setRefreshing] = React.useState(false);
  const [drill, setDrill] = React.useState(null);

  const profile = D.profiles[profileId];

  const onRefresh = () => {
    setRefreshing(true);
    setTimeout(() => setRefreshing(false), 1100);
  };

  // Apply tweaks to root
  React.useEffect(() => {
    document.documentElement.style.setProperty('--accent', t.accent);
    document.documentElement.style.setProperty('--accent-2', t.accent2);
    document.documentElement.dataset.theme = t.dark ? 'dark' : 'light';
    document.documentElement.dataset.density = t.density;
  }, [t.accent, t.accent2, t.dark, t.density]);

  return (
    <div className="dashboard">
      <Header
        profile={profile}
        profiles={D.profiles}
        onProfileChange={setProfileId}
        range={range}
        onRangeChange={setRange}
        onRefresh={onRefresh}
        refreshing={refreshing}
      />

      <main className="dash-main">
        <Hero
          profile={profile}
          range={range}
          dates={D.dates}
          accent={t.accent}
          onMetricClick={(m) => setDrill({ kind: 'metric', metric: m })}
          chartStyle={t.chartStyle}
        />

        <KpiStrip
          profile={profile}
          range={range}
          dates={D.dates}
          accent={t.accent}
          onMetricClick={(m) => setDrill({ kind: 'metric', metric: m })}
        />

        <GrowthPanel
          profile={profile}
          range={range}
          dates={D.dates}
          accent={t.accent}
          chartStyle={t.chartStyle}
        />

        <div className="grid-2">
          <ReelsPanel profile={profile} accent={t.accent} data={D} chartStyle={t.chartStyle} />
          <StoriesPanel profile={profile} accent={t.accent} data={D} chartStyle={t.chartStyle} />
        </div>

        <div className="grid-2">
          <DemographicsPanel profile={profile} accent={t.accent} data={D} />
          <BestTimePanel profile={profile} accent={t.accent} data={D} onExpand={() => setDrill({ kind: 'besttime' })} />
        </div>

        <TopPostsPanel
          profile={profile}
          accent={t.accent}
          data={D}
          range={range}
          onPostClick={(p) => setDrill({ kind: 'post', post: p })}
        />

        <footer className="dash-foot">
          <div className="foot-rule" />
          <div className="foot-inner">
            <span className="foot-l">Contemporary And (C&amp;) · Instagram Analytics</span>
            <span className="foot-r">Data: Instagram Graph API · Last sync 18 May 2026, 09:42 CET</span>
          </div>
        </footer>
      </main>

      <Modal open={drill?.kind === 'metric'} onClose={() => setDrill(null)} wide>
        {drill?.kind === 'metric' && (
          <MetricDrill
            metric={drill.metric}
            profile={profile}
            profiles={D.profiles}
            range={range}
            dates={D.dates}
            accent={t.accent}
            accent2={t.accent2}
          />
        )}
      </Modal>
      <Modal open={drill?.kind === 'post'} onClose={() => setDrill(null)} wide>
        {drill?.kind === 'post' && (
          <PostDrill post={drill.post} profile={profile} accent={t.accent} />
        )}
      </Modal>
      <Modal open={drill?.kind === 'besttime'} onClose={() => setDrill(null)} wide>
        {drill?.kind === 'besttime' && (
          <BestTimeDrill profile={profile} accent={t.accent} accent2={t.accent2} data={D} />
        )}
      </Modal>

      <TweaksPanel>
        <TweakSection label="Theme" />
        <TweakToggle label="Dark mode" value={t.dark} onChange={(v) => setTweak('dark', v)} />
        <TweakColor label="Accent" value={t.accent}
          options={['#000000', '#D4502E', '#1F4FD9', '#1F8A5B', '#B58A2C', '#7A5AE0']}
          onChange={(v) => setTweak('accent', v)} />
        <TweakColor label="Secondary" value={t.accent2}
          options={['#1F4FD9', '#2A6FDB', '#1F8A5B', '#D4502E', '#7A5AE0', '#B58A2C']}
          onChange={(v) => setTweak('accent2', v)} />

        <TweakSection label="Layout" />
        <TweakRadio label="Density" value={t.density}
          options={['compact', 'regular', 'comfy']}
          onChange={(v) => setTweak('density', v)} />
        <TweakRadio label="Chart" value={t.chartStyle}
          options={['line', 'area', 'bar']}
          onChange={(v) => setTweak('chartStyle', v)} />
      </TweaksPanel>
    </div>
  );
}

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "accent": "#000000",
  "accent2": "#1F4FD9",
  "dark": false,
  "density": "regular",
  "chartStyle": "area"
}/*EDITMODE-END*/;

window.__renderApp = () => ReactDOM.createRoot(document.getElementById('root')).render(<App />);
if (window.__dashboardDataReady) {
  window.__renderApp();
} else {
  window.addEventListener('dashboard-data-ready', window.__renderApp, { once: true });
}

</script>
</body>
</html>
