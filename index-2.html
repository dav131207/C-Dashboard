<script>
// Suppress benign Chrome ResizeObserver loop warning at the earliest possible point
(function() {
  const _RO = window.ResizeObserver;
  if (_RO) {
    window.ResizeObserver = class extends _RO {
      constructor(callback) {
        super((entries, observer) => {
          window.requestAnimationFrame(() => { try { callback(entries, observer); } catch (e) {} });
        });
      }
    };
  }
  window.addEventListener('error', (e) => {
    if (e && e.message && e.message.includes && e.message.includes('ResizeObserver loop')) {
      e.stopImmediatePropagation();
      e.preventDefault();
      return false;
    }
  }, true);
})();
</script>

<style>
/* ============================================================
   C& Instagram Analytics — Editorial dashboard
   ============================================================ */

:root {
  --accent: #000000;
  --accent-2: #1F4FD9;
  --bg: #f6f3ec;
  --ink: #111110;
  --ink-2: #4a4844;
  --ink-3: #8a8780;
  --rule: #1a1a18;
  --hair: rgba(17, 17, 16, 0.12);
  --panel: #faf8f2;
  --panel-2: #ece8dc;
  --good: #1f6d4a;
  --warn: #b04a2b;

  --serif: 'gotham', 'Montserrat', 'Helvetica Neue', Helvetica, Arial, sans-serif;
  --sans: 'favorit', 'DM Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;
}

html[data-theme="dark"] {
  --bg: #0e0d0b;
  --ink: #f5f1e6;
  --ink-2: #c2bdaf;
  --ink-3: #807c70;
  --rule: #f5f1e6;
  --hair: rgba(245, 241, 230, 0.14);
  --panel: #15140f;
  --panel-2: #1d1c16;
}

html[data-density="compact"]  { --gap: 16px; --pad: 14px; --h2: 22px; }
html[data-density="regular"]  { --gap: 24px; --pad: 22px; --h2: 26px; }
html[data-density="comfy"]    { --gap: 36px; --pad: 30px; --h2: 32px; }

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); }
body { font-family: var(--sans); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }

button { font-family: inherit; font-size: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
em { font-style: normal; color: var(--ink-3); font-size: 0.84em; letter-spacing: 0.02em; text-transform: uppercase; }

/* ===========================================================
   Header
   =========================================================== */
.dash-header {
  position: sticky; top: 0; z-index: 100;
  background: var(--bg);
  backdrop-filter: blur(8px);
}
.dash-header-inner {
  display: grid;
  grid-template-columns: 1fr auto auto;
  gap: 32px;
  align-items: center;
  padding: 16px 40px 14px;
  max-width: 1640px;
  margin: 0 auto;
}
.dash-header-rule { height: 1px; background: var(--rule); }

.brand { display: flex; align-items: center; gap: 14px; }
.brand-mark {
  width: 44px; height: 44px;
  display: flex; align-items: center; justify-content: center;
  position: relative;
  flex-shrink: 0;
}
.brand-mark img {
  width: 100%; height: 100%;
  object-fit: contain;
  display: block;
}
html[data-theme="dark"] .brand-mark img {
  filter: invert(1);
}
.brand-text { display: flex; flex-direction: column; line-height: 1.15; }
.brand-name { font-family: var(--serif); font-weight: 700; font-size: 18px; letter-spacing: -0.005em; text-transform: uppercase; }
.brand-product {
  font-family: var(--mono); font-size: 10.5px; text-transform: uppercase;
  letter-spacing: 0.16em; color: var(--ink-3); margin-top: 1px;
}

/* Profile switch */
.profile-switch {
  display: flex; gap: 0;
  border: 1px solid var(--rule);
  background: var(--panel);
}
.profile-tab {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 14px 8px 8px;
  border-right: 1px solid var(--hair);
  position: relative;
  transition: background .15s;
}
.profile-tab:last-child { border-right: 0; }
.profile-tab:hover { background: var(--panel-2); }
.profile-tab.on {
  background: var(--ink);
  color: var(--bg);
}
.pt-avatar {
  width: 32px; height: 32px;
  border-radius: 50%;
  background: var(--panel-2);
  display: flex; align-items: center; justify-content: center;
  font-family: var(--sans);
  font-weight: 700; font-size: 11px;
  letter-spacing: -0.03em;
  border: 1px solid var(--hair);
}
.profile-tab.on .pt-avatar { background: var(--bg); color: var(--ink); border-color: transparent; }
.pt-meta { display: flex; flex-direction: column; line-height: 1.15; text-align: left; }
.pt-handle { font-size: 12.5px; letter-spacing: -0.01em; font-weight: 500; }
.pt-count { font-family: var(--mono); font-size: 10px; letter-spacing: 0.04em; opacity: 0.7; text-transform: uppercase; }

/* Date range picker */
.dash-controls { display: flex; gap: 8px; align-items: stretch; }
.drp { position: relative; }
.drp-trigger {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 14px;
  white-space: nowrap;
  border: 1px solid var(--rule);
  background: var(--panel);
  font-size: 12.5px;
  height: 100%;
}
.drp-trigger:hover { background: var(--panel-2); }
.drp-text { font-family: var(--mono); font-size: 11px; letter-spacing: 0.02em; white-space: nowrap; }
.drp-days {
  font-family: var(--mono); font-size: 10px;
  padding: 3px 8px;
  background: var(--ink); color: var(--bg);
  text-transform: uppercase; letter-spacing: 0.08em;
}
.drp-panel {
  position: absolute; right: 0; top: calc(100% + 6px);
  background: var(--panel);
  border: 1px solid var(--rule);
  padding: 18px;
  width: 540px;
  z-index: 200;
  box-shadow: 0 24px 40px -16px rgba(0,0,0,0.18);
}
.drp-presets { display: flex; gap: 6px; margin-bottom: 14px; }
.drp-chip {
  padding: 6px 12px;
  border: 1px solid var(--hair);
  font-family: var(--mono); font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.08em;
}
.drp-chip:hover { border-color: var(--rule); }
.drp-chip.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }

.drp-cal { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
.cal-month { font-size: 12px; }
.cal-title {
  font-family: var(--serif); font-weight: 500; font-size: 14px;
  margin-bottom: 8px; letter-spacing: 0.02em; text-transform: uppercase;
}
.cal-dow {
  display: grid; grid-template-columns: repeat(7, 1fr);
  font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.1em;
  color: var(--ink-3); text-transform: uppercase;
  padding-bottom: 6px;
  border-bottom: 1px solid var(--hair);
}
.cal-dow span { text-align: center; }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 0; margin-top: 4px; }
.cal-day, .cal-empty { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; font-family: var(--mono); font-size: 11px; transition: background .12s; }
.cal-day { border-radius: 0; }
.cal-day:hover:not(.future) { background: var(--panel-2); }
.cal-day.in { background: var(--ink); color: var(--bg); }
.cal-day.start, .cal-day.end { background: var(--accent); color: white; font-weight: 600; }
.cal-day.future { opacity: 0.25; cursor: not-allowed; }

.drp-footer { display: flex; justify-content: space-between; align-items: flex-end; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--hair); }
.drp-inputs { display: flex; gap: 12px; }
.drp-inputs label { font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-3); display: flex; flex-direction: column; gap: 4px; }
.drp-inputs input { font-family: var(--mono); font-size: 12px; border: 1px solid var(--hair); padding: 5px 8px; background: transparent; color: var(--ink); }
.drp-apply { padding: 8px 18px; background: var(--ink); color: var(--bg); font-size: 12px; letter-spacing: 0.04em; }

.btn-icon {
  width: 38px; height: 38px;
  display: flex; align-items: center; justify-content: center;
  border: 1px solid var(--rule); background: var(--panel);
}
.btn-icon:hover { background: var(--panel-2); }
.spin { animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ===========================================================
   Main
   =========================================================== */
.dash-main {
  max-width: 1640px; margin: 0 auto;
  padding: var(--gap) 40px 80px;
  display: flex; flex-direction: column;
  gap: var(--gap);
}

/* HERO */
.hero {
  display: grid;
  grid-template-columns: 1fr minmax(380px, 460px);
  gap: var(--gap);
  border-bottom: 1px solid var(--rule);
  padding-bottom: var(--gap);
  align-items: stretch;
}
.hero-left { display: flex; flex-direction: column; gap: 24px; }
.hero-eyebrow {
  display: flex; align-items: center; gap: 10px;
  font-family: var(--mono); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--ink-3);
}
.eb-dot { width: 8px; height: 8px; border-radius: 50%; }
.eb-handle { color: var(--ink); }
.eb-verified {
  display: inline-flex; align-items: center; justify-content: center;
  width: 16px; height: 16px; border-radius: 50%; background: var(--accent); color: white;
  font-size: 10px;
}
.hero-title {
  font-family: var(--serif); font-weight: 700;
  font-size: clamp(46px, 6vw, 82px);
  line-height: 0.95;
  letter-spacing: -0.035em;
  margin: 18px 0 0;
  max-width: 14ch;
  text-wrap: balance;
  text-transform: none;
}
.hero-title .hero-sub {
  display: block;
  font-family: var(--sans);
  font-size: 17px;
  letter-spacing: 0;
  color: var(--ink-2);
  margin-top: 18px;
  font-weight: 400;
  line-height: 1.45;
  max-width: 48ch;
  text-wrap: pretty;
}
.hero-meta {
  display: flex; gap: 32px; margin-top: auto;
  padding-top: 16px;
  font-size: 13px;
  flex-wrap: wrap;
}
.hero-meta span { display: flex; flex-direction: column; gap: 2px; }

.hero-right {
  border: 1px solid var(--rule);
  background: var(--panel);
  padding: var(--pad);
  display: flex; flex-direction: column;
  position: relative;
  text-align: left;
  cursor: pointer;
  transition: background .2s;
}
.hero-right:hover { background: var(--panel-2); }
.hero-r-top { display: flex; justify-content: space-between; align-items: baseline; }
.hero-r-label { font-family: var(--mono); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-3); }
.hero-r-period { font-family: var(--mono); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-3); }
.hero-r-value {
  font-family: var(--serif); font-weight: 700;
  font-size: 80px;
  line-height: 0.95;
  letter-spacing: -0.04em;
  margin: 14px 0 10px;
  font-variant-numeric: tabular-nums;
}
.hero-r-delta { display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; }
.delta.up { color: var(--good); }
.delta.down { color: var(--warn); }
.delta em { color: inherit; opacity: 0.7; font-size: 0.88em; }
.hero-r-prev { font-family: var(--mono); font-size: 10.5px; color: var(--ink-3); letter-spacing: 0.02em; }
.hero-r-spark { margin-top: 14px; flex: 1; min-height: 60px; display: flex; align-items: flex-end; }
.hero-r-cta {
  font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase;
  border-top: 1px solid var(--hair);
  padding-top: 12px;
  margin-top: 14px;
  color: var(--ink-2);
}
.hero-right:hover .hero-r-cta { color: var(--accent); }

/* KPI strip */
.kpi-strip {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  border-top: 1px solid var(--rule);
  border-bottom: 1px solid var(--rule);
}
.kpi-card {
  padding: var(--pad);
  text-align: left;
  border-right: 1px solid var(--hair);
  display: flex; flex-direction: column; gap: 6px;
  transition: background .15s;
  position: relative;
}
.kpi-card:last-child { border-right: 0; }
.kpi-card:hover { background: var(--panel); }
.kpi-card:hover::after {
  content: '↗';
  position: absolute; top: var(--pad); right: var(--pad);
  font-size: 14px; color: var(--accent);
}
.kpi-top { display: flex; justify-content: space-between; align-items: center; }
.kpi-label { font-family: var(--mono); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-3); }
.kpi-delta { font-family: var(--mono); font-size: 11px; letter-spacing: 0.02em; }
.kpi-delta.up { color: var(--good); }
.kpi-delta.down { color: var(--warn); }
.kpi-value {
  font-family: var(--serif); font-weight: 700;
  font-size: 40px;
  line-height: 1;
  letter-spacing: -0.03em;
  margin-top: 4px;
  font-variant-numeric: tabular-nums;
}
.kpi-sub { font-family: var(--mono); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); }
.kpi-spark { margin-top: 8px; opacity: 0.8; }

/* PANEL */
.panel {
  border-top: 1px solid var(--rule);
  padding-top: var(--gap);
  position: relative;
}
.panel-head {
  display: flex; align-items: center; justify-content: space-between;
  gap: 16px; flex-wrap: wrap;
  margin-bottom: 18px;
}
.panel-title {
  font-family: var(--serif);
  font-weight: 700;
  font-size: var(--h2);
  letter-spacing: -0.025em;
  margin: 0;
  white-space: nowrap;
}
.panel-sub { font-family: var(--mono); font-size: 11px; letter-spacing: 0.06em; color: var(--ink-3); text-transform: uppercase; }
.panel-body { position: relative; }

.metric-switch, .seg-tabs {
  display: flex; gap: 0;
  border: 1px solid var(--hair);
}
.ms-tab, .seg-tab {
  padding: 6px 14px;
  font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase;
  border-right: 1px solid var(--hair);
  transition: background .15s;
}
.ms-tab:last-child, .seg-tab:last-child { border-right: 0; }
.ms-tab:hover, .seg-tab:hover { background: var(--panel-2); }
.ms-tab.on, .seg-tab.on { background: var(--ink); color: var(--bg); }

/* Chart wrap */
.chart-wrap { position: relative; color: var(--ink); }
.chart-tooltip {
  position: absolute; top: 0; transform: translateX(-50%);
  background: var(--ink); color: var(--bg);
  padding: 8px 12px;
  pointer-events: none;
  white-space: nowrap;
}
.t-date { font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.06em; text-transform: uppercase; opacity: 0.65; }
.t-val { font-family: var(--serif); font-weight: 700; font-size: 16px; line-height: 1; margin-top: 3px; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }

/* Reels / Stories  */
.retention-stats {
  display: grid; grid-template-columns: repeat(4, 1fr);
  border: 1px solid var(--hair);
  margin-bottom: 14px;
}
.rs-row { padding: 12px 14px; border-right: 1px solid var(--hair); display: flex; flex-direction: column; gap: 4px; }
.rs-row:last-child { border-right: 0; }
.rs-row span { font-family: var(--mono); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); }
.rs-row strong { font-family: var(--serif); font-size: 22px; font-weight: 700; letter-spacing: -0.02em; line-height: 1; }
.rs-row strong.good { color: var(--good); }
.rs-row strong.warn { color: var(--warn); }

/* Grid two-up */
.grid-2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0;
}
.grid-2 > .panel { padding-right: var(--gap); }
.grid-2 > .panel:last-child { padding-left: var(--gap); padding-right: 0; border-left: 1px solid var(--hair); }

/* HBar list */
.hbar-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; }
.hbar-row { display: grid; grid-template-columns: 110px 1fr 56px; align-items: center; gap: 12px; }
.hbar-label { font-size: 13px; }
.hbar-track { background: var(--hair); height: 8px; position: relative; }
.hbar-fill { position: absolute; left: 0; top: 0; bottom: 0; transition: width .35s ease; }
.hbar-val { font-family: var(--mono); font-size: 11px; text-align: right; font-variant-numeric: tabular-nums; }

/* Donut */
.donut-wrap { display: flex; gap: 24px; align-items: center; }
.donut-legend { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 10px; flex: 1; }
.donut-legend li { display: grid; grid-template-columns: 16px 1fr auto; align-items: center; gap: 10px; }
.donut-sw { width: 12px; height: 12px; }
.donut-lab { font-size: 13px; }
.donut-pct { font-family: var(--mono); font-size: 12px; font-variant-numeric: tabular-nums; }

/* Heatmap */
.heatmap { font-family: var(--mono); user-select: none; }
.hm-hours { position: relative; height: 14px; margin-left: 38px; margin-bottom: 4px; }
.hm-hours span { position: absolute; font-size: 9px; letter-spacing: 0.08em; color: var(--ink-3); transform: translateX(-50%); }
.hm-grid { display: flex; flex-direction: column; gap: 2px; }
.hm-row { display: grid; grid-template-columns: 38px 1fr; align-items: center; gap: 6px; }
.hm-day { font-size: 10px; letter-spacing: 0.08em; color: var(--ink-3); text-transform: uppercase; }
.hm-cells { display: grid; grid-template-columns: repeat(24, 1fr); gap: 2px; }
.hm-cell { height: 18px; transition: transform .12s, outline-color .12s; cursor: pointer; }
.hm-cell:hover, .hm-cell.hover { outline: 1.5px solid var(--ink); outline-offset: -1px; transform: scale(1.05); z-index: 1; }
.hm-readout {
  margin-top: 12px;
  display: flex; gap: 16px; align-items: baseline;
  padding: 10px 12px;
  background: var(--panel-2);
  border-left: 2px solid var(--accent);
}
.hm-readout-label { font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); }
.hm-readout-val { font-family: var(--serif); font-weight: 700; font-size: 18px; letter-spacing: -0.02em; }

.bt-peak {
  margin-top: 14px;
  padding-top: 14px;
  border-top: 1px solid var(--hair);
  display: flex; justify-content: space-between; align-items: baseline;
}
.bt-peak-label { font-family: var(--mono); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-3); }

<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script>
// ============================================================
// REAL DATA ADAPTER — fetches from GitHub and builds window.DASHBOARD_DATA
// Replaces the original mock data block.
// ============================================================

(function () {
  // ----------------- CONFIGURATION -----------------
  // Adjust these if your repo / branch / usernames differ.
  const CONFIG = {
    dataBaseUrl: 'https://raw.githubusercontent.com/dav131207/C-Dashboard/main/data',
    profiles: {
      main: {
        username: 'contemporaryand',
        handle: '@contemporaryand',
        name: 'Contemporary And',
        bio: 'Platform for international contemporary art and thought.',
        avatar: 'C&',
        location: 'Berlin · Global',
        language: 'EN · DE',
        verified: true,
      },
      al: {
        username: 'contemporaryand.americalatina',
        handle: '@contemporaryand.americalatina',
        name: 'C& América Latina',
        bio: 'Plataforma para arte contemporáneo desde América Latina.',
        avatar: 'C&AL',
        location: 'São Paulo · México · Berlin',
        language: 'ES · PT · EN',
        verified: false,
      },
    },
    daysWindow: 365, // how many trailing days to expose to the dashboard
  };

  // ----------------- HELPERS -----------------
  const isoDate = (d) => d.toISOString().slice(0, 10);
  const startOfDay = (s) => new Date(s.slice(0, 10) + 'T00:00:00Z');

  const buildDateLabels = (days) => {
    const end = new Date();
    end.setUTCHours(0, 0, 0, 0);
    const out = [];
    for (let i = days - 1; i >= 0; i--) {
      out.push(isoDate(new Date(end.getTime() - i * 86400000)));
    }
    return out;
  };

  const fetchJson = async (path) => {
    const res = await fetch(`${CONFIG.dataBaseUrl}/${path}`, { cache: 'no-store' });
    if (!res.ok) throw new Error(`${path}: HTTP ${res.status}`);
    return res.json();
  };

  // Try fetching, return null if missing (some profiles may not have all files yet)
  const tryFetchJson = async (path) => {
    try { return await fetchJson(path); } catch (e) { console.warn(`[adapter] ${path} not available:`, e.message); return null; }
  };

  // ----------------- TRANSFORMERS -----------------

  // Per-post → dashboard POSTS entry
  const mapPostType = (m) => {
    if (m.media_product_type === 'REELS') return 'reel';
    if (m.media_type === 'CAROUSEL_ALBUM') return 'carousel';
    if (m.media_type === 'VIDEO') return 'video';
    return 'image';
  };

  const cleanTitle = (caption) => {
    if (!caption) return '(ohne Beschreibung)';
    const firstLine = caption.split('\n')[0].trim();
    return firstLine.length > 80 ? firstLine.slice(0, 77) + '…' : firstLine;
  };

  // Generate a deterministic swatch color from the post id
  const swatchFor = (id) => {
    const palette = ['#3f3a36', '#c7903f', '#7a8a55', '#1d1d1b', '#3a5a3a', '#9a4a3a', '#dca087', '#e8d4b8', '#1d2a3a'];
    let h = 0;
    for (let i = 0; i < id.length; i++) h = (h * 31 + id.charCodeAt(i)) | 0;
    return palette[Math.abs(h) % palette.length];
  };

  const transformPosts = (mediaArray, username) => {
    const sorted = [...(mediaArray || [])].sort((a, b) => (b.timestamp || '').localeCompare(a.timestamp || ''));
    return sorted.map((m) => {
      const i = m.insights || {};
      // Local thumbnail path in repo: data/thumbnails/<username>/<media_id>.jpg
      const thumbnail = username ? `${CONFIG.dataBaseUrl}/thumbnails/${username}/${m.id}.jpg` : null;
      return {
        id: m.id,
        type: mapPostType(m),
        title: cleanTitle(m.caption),
        date: (m.timestamp || '').slice(0, 10),
        reach: i.reach || 0,
        likes: i.likes || 0,
        comments: i.comments || 0,
        saves: i.saved || 0,
        shares: i.shares || 0,
        plays: i.views || undefined,
        duration: i.ig_reels_avg_watch_time || undefined,
        swatch: swatchFor(m.id),
        thumbnail,
        url: m.permalink || '#',
      };
    });
  };

  // Aggregate post-level metric by day, project onto the 365-day window
  const aggregatePostsByDay = (mediaArray, getValue, dates) => {
    const byDay = new Map();
    for (const m of mediaArray || []) {
      if (!m.timestamp) continue;
      const day = m.timestamp.slice(0, 10);
      byDay.set(day, (byDay.get(day) || 0) + (getValue(m) || 0));
    }
    return dates.map((d) => byDay.get(d) || 0);
  };

  // Take a follower_history array and project a metric to the 365-day window.
  // For days before the first datapoint, repeat the earliest known value (best-effort).
  // For days after the last datapoint, repeat the latest.
  const projectHistory = (history, key, dates) => {
    if (!history || !history.length) return dates.map(() => 0);
    const map = new Map(history.map((h) => [h.date, h[key] ?? 0]));
    const known = history.map((h) => ({ date: h.date, value: h[key] ?? 0 })).sort((a, b) => a.date.localeCompare(b.date));
    const first = known[0].value;
    const last = known[known.length - 1].value;
    return dates.map((d) => {
      if (map.has(d)) return map.get(d);
      if (d < known[0].date) return first;
      if (d > known[known.length - 1].date) return last;
      // Between known points — use the most recent earlier value (step interpolation)
      let prev = first;
      for (const k of known) { if (k.date <= d) prev = k.value; else break; }
      return prev;
    });
  };

  // Best-time-to-post heatmap: 7 rows (Sun-Sat) × 24 cols, avg reach
  const buildBestTime = (mediaArray) => {
    const sums = Array.from({ length: 7 }, () => Array(24).fill(0));
    const counts = Array.from({ length: 7 }, () => Array(24).fill(0));
    for (const m of mediaArray || []) {
      if (!m.timestamp) continue;
      const d = new Date(m.timestamp);
      const wd = d.getUTCDay();
      const hr = d.getUTCHours();
      const reach = m.insights?.reach || 0;
      sums[wd][hr] += reach;
      counts[wd][hr] += 1;
    }
    return sums.map((row, i) => row.map((s, j) => counts[i][j] ? Math.round(s / counts[i][j]) : 0));
  };

  // Hashtag extraction from captions
  const buildHashtags = (mediaArray, limit = 10) => {
    const tagStats = new Map();
    for (const m of mediaArray || []) {
      const caption = m.caption || '';
      const tags = caption.match(/#[\p{L}0-9_]+/gu) || [];
      const i = m.insights || {};
      const engagement = (i.likes || 0) + (i.comments || 0) + (i.saved || 0) + (i.shares || 0);
      const reach = i.reach || 0;
      for (const t of new Set(tags.map((x) => x.toLowerCase()))) {
        const s = tagStats.get(t) || { tag: t, posts: 0, reach: 0, engagement: 0 };
        s.posts += 1;
        s.reach += reach;
        s.engagement += engagement;
        tagStats.set(t, s);
      }
    }
    return Array.from(tagStats.values())
      .map((s) => ({ tag: s.tag, posts: s.posts, reach: s.reach, engagement: s.posts ? +(s.engagement / s.posts / Math.max(s.reach / s.posts, 1) * 100).toFixed(1) : 0 }))
      .sort((a, b) => b.reach - a.reach)
      .slice(0, limit);
  };

  // Stories completion: most recent story's frame views (limited to first 8 stories of latest session)
  const buildStoriesCompletion = (storiesArray) => {
    if (!storiesArray || !storiesArray.length) return Array(8).fill(0);
    const sorted = [...storiesArray].sort((a, b) => (b.timestamp || '').localeCompare(a.timestamp || '')).slice(0, 8);
    sorted.sort((a, b) => (a.timestamp || '').localeCompare(b.timestamp || ''));
    return sorted.map((s) => s.insights?.reach || s.insights?.impressions || 0);
  };

  // Reels retention: average watch time across reels (we don't have second-by-second curves from the API,
  // so we build a synthetic decay curve scaled by avg watch time). This is a best-effort placeholder
  // until per-reel retention is available.
  const buildReelsRetention = (mediaArray) => {
    const reels = (mediaArray || []).filter((m) => m.media_product_type === 'REELS');
    if (!reels.length) return Array.from({ length: 31 }, (_, i) => Math.max(0, 100 - i * 3));
    const avgWatch = reels.map((r) => r.insights?.ig_reels_avg_watch_time || 0).filter((v) => v > 0);
    const meanSec = avgWatch.length ? avgWatch.reduce((a, b) => a + b, 0) / avgWatch.length / 1000 : 10;
    // Half-life proxy: 50% of viewers drop off around 2× avg-watch-time
    const halfLife = Math.max(meanSec * 2, 4);
    return Array.from({ length: 31 }, (_, i) => Math.round(100 * Math.pow(0.5, i / halfLife)));
  };

  // ----------------- DEMOGRAPHICS TRANSFORMER -----------------
  const transformDemographics = (demo) => {
    const ageOrder = ['13-17', '18-24', '25-34', '35-44', '45-54', '55-64', '65+'];
    const norm = (arr) => arr || [];
    const total = (arr) => arr.reduce((s, x) => s + (x.value || 0), 0) || 1;
    const asPct = (arr) => {
      const t = total(arr);
      return arr.map((x) => ({ ...x, value: Math.round((x.value / t) * 100) }));
    };

    const age = norm(demo.age)
      .map((d) => ({ bucket: d.label, value: d.value || 0 }))
      .sort((a, b) => ageOrder.indexOf(a.bucket) - ageOrder.indexOf(b.bucket));

    const gender = norm(demo.gender).map((d) => {
      const m = { M: 'Men', F: 'Women', U: 'Other' };
      return { label: m[d.label] || d.label, value: d.value || 0 };
    });

    return {
      age: asPct(age),
      gender: asPct(gender),
      countries: asPct(norm(demo.country).map((d) => ({ label: d.label, value: d.value || 0 })).sort((a, b) => b.value - a.value).slice(0, 10)),
      cities: asPct(norm(demo.city).map((d) => ({ label: d.label, value: d.value || 0 })).sort((a, b) => b.value - a.value).slice(0, 8)),
    };
  };

  // ----------------- BUILD ONE PROFILE -----------------
  const buildProfile = async (cfg, dates) => {
    const u = cfg.username;
    const [postsFile, history, stories] = await Promise.all([
      fetchJson(`instagram_data_${u}.json`),
      tryFetchJson(`follower_history_${u}.json`).then((v) => v || []),
      tryFetchJson(`stories_history_${u}.json`).then((v) => v || []),
    ]);

    const account = postsFile.account || {};
    const media = postsFile.media || [];

    const series = {
      followers: projectHistory(history, 'followers', dates),
      reach: aggregatePostsByDay(media, (m) => m.insights?.reach, dates),
      impressions: aggregatePostsByDay(media, (m) => m.insights?.views || m.insights?.reach, dates),
      profile_views: projectHistory(history, 'profile_views', dates),
      website_clicks: projectHistory(history, 'website_clicks', dates),
      engagement: aggregatePostsByDay(media, (m) => (m.insights?.likes || 0) + (m.insights?.comments || 0) + (m.insights?.saved || 0) + (m.insights?.shares || 0), dates),
    };

    return {
      profile: {
        id: cfg === CONFIG.profiles.main ? 'main' : 'al',
        handle: cfg.handle,
        name: cfg.name,
        bio: cfg.bio,
        avatar: cfg.avatar,
        location: cfg.location,
        language: cfg.language,
        verified: cfg.verified,
        followers_total: account.followers_count || 0,
        following: account.follows_count || 0,
        posts_total: account.media_count || 0,
        series,
      },
      posts: transformPosts(media, u),
      bestTime: buildBestTime(media),
      hashtags: buildHashtags(media),
      reelsRetention: buildReelsRetention(media),
      storiesCompletion: buildStoriesCompletion(stories),
      demographics: transformDemographics(account.demographics || {}),
    };
  };

  // ----------------- LOADING UI -----------------
  const showLoading = (msg) => {
    let el = document.getElementById('__data_loading_overlay');
    if (!el) {
      el = document.createElement('div');
      el.id = '__data_loading_overlay';
      el.style.cssText = 'position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#fafafa;font:14px/1.5 -apple-system,system-ui,sans-serif;color:#1a1a1a;z-index:9999;letter-spacing:0.01em;';
      document.body.appendChild(el);
    }
    el.textContent = msg;
  };
  const hideLoading = () => { const el = document.getElementById('__data_loading_overlay'); if (el) el.remove(); };
  const showError = (msg) => {
    showLoading(`⚠ ${msg} — siehe Browser-Konsole`);
    const el = document.getElementById('__data_loading_overlay');
    if (el) el.style.color = '#a33';
  };

  // ----------------- MAIN -----------------
  showLoading('Lade Instagram-Daten von GitHub…');

  (async () => {
    try {
      const dates = buildDateLabels(CONFIG.daysWindow);
      const [mainRes, alRes] = await Promise.all([
        buildProfile(CONFIG.profiles.main, dates),
        buildProfile(CONFIG.profiles.al, dates),
      ]);

      window.DASHBOARD_DATA = {
        dates,
        profiles: { main: mainRes.profile, al: alRes.profile },
        posts: { main: mainRes.posts, al: alRes.posts },
        reelsRetention: { main: mainRes.reelsRetention, al: alRes.reelsRetention },
        storiesCompletion: { main: mainRes.storiesCompletion, al: alRes.storiesCompletion },
        demographics: { main: mainRes.demographics, al: alRes.demographics },
        bestTime: { main: mainRes.bestTime, al: alRes.bestTime },
        hashtags: { main: mainRes.hashtags, al: alRes.hashtags },
      };

      window.__dashboardDataReady = true;
      hideLoading();
      if (typeof window.__renderApp === 'function') window.__renderApp();
      else window.dispatchEvent(new Event('dashboard-data-ready'));
    } catch (err) {
      console.error('[adapter] Failed to load data:', err);
      showError('Fehler beim Laden der Daten');
    }
  })();
})();
</script>

// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    // Same-window signal so in-page listeners (deck-stage rail thumbnails)
    // can react — the parent message only reaches the host, not peers.
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', noDeckControls = false, children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  // Auto-inject a rail toggle when a <deck-stage> is on the page. The
  // toggle drives the deck's per-viewer _railVisible via window message;
  // state is mirrored from the same localStorage key the deck reads so
  // the control reflects reality across reloads. The mechanism is the
  // message — authors who want custom placement can post it directly
  // and pass noDeckControls to suppress this one.
  const hasDeckStage = React.useMemo(
    () => typeof document !== 'undefined' && !!document.querySelector('deck-stage'),
    [],
  );
  // deck-stage enables its rail in connectedCallback, but this panel can
  // mount before that element has upgraded. The initial read catches the
  // common case; the listener covers mounting first. (Older deck-stage.js
  // copies still wait for the host's __omelette_rail_enabled postMessage —
  // same listener handles those.)
  const [railEnabled, setRailEnabled] = React.useState(
    () => hasDeckStage && !!document.querySelector('deck-stage')?._railEnabled,
  );
  React.useEffect(() => {
    if (!hasDeckStage || railEnabled) return undefined;
    const onMsg = (e) => {
      if (e.data && e.data.type === '__omelette_rail_enabled') setRailEnabled(true);
    };
    window.addEventListener('message', onMsg);
    return () => window.removeEventListener('message', onMsg);
  }, [hasDeckStage, railEnabled]);
  const [railVisible, setRailVisible] = React.useState(() => {
    try { return localStorage.getItem('deck-stage.railVisible') !== '0'; } catch (e) { return true; }
  });
  const toggleRail = (on) => {
    setRailVisible(on);
    window.postMessage({ type: '__deck_rail_visible', on }, '*');
  };
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-noncommentable=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">
          {children}
          {hasDeckStage && railEnabled && !noDeckControls && (
            <TweakSection label="Deck">
              <TweakToggle label="Thumbnail rail" value={railVisible} onChange={toggleRail} />
            </TweakSection>
          )}
        </div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  // Segments wrap mid-word once per-segment width runs out. The track is
  // ~248px (280 panel − 28 body pad − 4 seg pad), each button loses 12px
  // to its own padding, and 11.5px system-ui averages ~6.3px/char — so 2
  // options fit ~16 chars each, 3 fit ~10. Past that (or >3 options), fall
  // back to a dropdown rather than wrap.
  const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;
  const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
  const fitsAsSegments = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);
  if (!fitsAsSegments) {
    // <select> emits strings — map back to the original option value so the
    // fallback stays type-preserving (numbers, booleans) like the segment path.
    const resolve = (s) => {
      const m = options.find((o) => String(typeof o === 'object' ? o.value : o) === s);
      return m === undefined ? s : typeof m === 'object' ? m.value : m;
    };
    return <TweakSelect label={label} value={value} options={options}
                        onChange={(s) => onChange(resolve(s))} />;
  }
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

// Relative-luminance contrast pick — checkmarks drawn over a swatch need to
// read on both #111 and #fafafa without per-option configuration. Hex input
// only (#rgb / #rrggbb); named or rgb()/hsl() colors fall through to "light".
function __twkIsLight(hex) {
  const h = String(hex).replace('#', '');
  const x = h.length === 3 ? h.replace(/./g, (c) => c + c) : h.padEnd(6, '0');
  const n = parseInt(x.slice(0, 6), 16);
  if (Number.isNaN(n)) return true;
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return r * 299 + g * 587 + b * 114 > 148000;
}

const __TwkCheck = ({ light }) => (
  <svg viewBox="0 0 14 14" aria-hidden="true">
    <path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2"
          strokeLinecap="round" strokeLinejoin="round"
          stroke={light ? 'rgba(0,0,0,.78)' : '#fff'} />
  </svg>
);

// TweakColor — curated color/palette picker. Each option is either a single
// hex string or an array of 1-5 hex strings; the card adapts — a lone color
// renders solid, a palette renders colors[0] as the hero (left ~2/3) with the
// rest stacked in a sharp column on the right. onChange emits the
// option in the shape it was passed (string stays string, array stays array).
// Without options it falls back to the native color input for back-compat.
function TweakColor({ label, value, options, onChange }) {
  if (!options || !options.length) {
    return (
      <div className="twk-row twk-row-h">
        <div className="twk-lbl"><span>{label}</span></div>
        <input type="color" className="twk-swatch" value={value}
               onChange={(e) => onChange(e.target.value)} />
      </div>
    );
  }
  // Native <input type=color> emits lowercase hex per the HTML spec, so
  // compare case-insensitively. String() guards JSON.stringify(undefined),
  // which returns the primitive undefined (no .toLowerCase).
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  return (
    <TweakRow label={label}>
      <div className="twk-chips" role="radiogroup">
        {options.map((o, i) => {
          const colors = Array.isArray(o) ? o : [o];
          const [hero, ...rest] = colors;
          const sup = rest.slice(0, 4);
          const on = key(o) === cur;
          return (
            <button key={i} type="button" className="twk-chip" role="radio"
                    aria-checked={on} data-on={on ? '1' : '0'}
                    aria-label={colors.join(', ')} title={colors.join(' · ')}
                    style={{ background: hero }}
                    onClick={() => onChange(o)}>
              {sup.length > 0 && (
                <span>
                  {sup.map((c, j) => <i key={j} style={{ background: c }} />)}
                </span>
              )}
              {on && <__TwkCheck light={__twkIsLight(hero)} />}
            </button>
          );
        })}
      </div>
    </TweakRow>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});

</script>

<script type="text/babel" data-presets="react">
// Minimal hand-rolled chart primitives. SVG-based, no chart lib.
// Each component renders a clean editorial chart with hover tooltip.

const fmt = (n) => {
  if (n == null) return '—';
  if (Math.abs(n) >= 1_000_000) return (n / 1_000_000).toFixed(1).replace(/\.0$/, '') + 'M';
  if (Math.abs(n) >= 1_000)     return (n / 1_000).toFixed(1).replace(/\.0$/, '') + 'k';
  return Math.round(n).toLocaleString('en-US');
};
const fmtPct = (n, d = 1) => (n == null ? '—' : `${n.toFixed(d)}%`);
const fmtDate = (iso) => {
  if (!iso || !/^\d{4}-\d{2}-\d{2}$/.test(iso)) return iso || '—';
  const d = new Date(iso + 'T00:00:00Z');
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric', timeZone: 'UTC' });
};
const fmtDateShort = (iso) => {
  if (!iso || !/^\d{4}-\d{2}-\d{2}$/.test(iso)) return iso || '';
  const d = new Date(iso + 'T00:00:00Z');
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', timeZone: 'UTC' });
};

// ─────────────────────────────────────────────────────────────────────────
// LineChart / AreaChart
//   props: { values, dates, accent, style: 'line'|'area'|'bar', height, formatValue }
// ─────────────────────────────────────────────────────────────────────────
function LineChart({ values, dates, accent = '#000', style = 'area', height = 220, formatValue = fmt, compact = false }) {
  const W = 1000, H = height;
  const pad = compact ? { l: 0, r: 0, t: 8, b: 0 } : { l: 44, r: 16, t: 12, b: 24 };
  const innerW = W - pad.l - pad.r;
  const innerH = H - pad.t - pad.b;

  const min = Math.min(...values);
  const max = Math.max(...values);
  const range = max - min || 1;
  const yMin = min - range * 0.08;
  const yMax = max + range * 0.08;

  const x = (i) => pad.l + (i / (values.length - 1)) * innerW;
  const y = (v) => pad.t + (1 - (v - yMin) / (yMax - yMin)) * innerH;

  const pathD = values.map((v, i) => `${i === 0 ? 'M' : 'L'}${x(i).toFixed(2)},${y(v).toFixed(2)}`).join(' ');
  const areaD = pathD + ` L${x(values.length - 1).toFixed(2)},${(pad.t + innerH).toFixed(2)} L${x(0).toFixed(2)},${(pad.t + innerH).toFixed(2)} Z`;

  const [hover, setHover] = React.useState(null);
  const svgRef = React.useRef(null);

  const onMove = (e) => {
    const svg = svgRef.current;
    const rect = svg.getBoundingClientRect();
    const px = ((e.clientX - rect.left) / rect.width) * W;
    const i = Math.round(((px - pad.l) / innerW) * (values.length - 1));
    const clamped = Math.max(0, Math.min(values.length - 1, i));
    setHover(clamped);
  };

  const yTicks = compact ? [] : [yMin, (yMin + yMax) / 2, yMax];
  const xTickIdx = compact ? [] : [0, Math.floor(values.length / 4), Math.floor(values.length / 2), Math.floor(3 * values.length / 4), values.length - 1];

  return (
    <div className="chart-wrap" style={{ width: '100%' }}>
      <svg ref={svgRef} viewBox={`0 0 ${W} ${H}`} preserveAspectRatio="none"
           style={{ width: '100%', height, display: 'block', cursor: 'crosshair' }}
           onMouseMove={onMove} onMouseLeave={() => setHover(null)}>
        {/* gridlines */}
        {yTicks.map((t, i) => (
          <line key={i} x1={pad.l} x2={W - pad.r} y1={y(t)} y2={y(t)} stroke="currentColor" strokeOpacity="0.08" strokeWidth="1" />
        ))}
        {/* area or bars */}
        {style === 'area' && <path d={areaD} fill={accent} fillOpacity="0.10" />}
        {style === 'bar' && values.map((v, i) => {
          const bw = Math.max(1, innerW / values.length - 1);
          return <rect key={i} x={x(i) - bw / 2} y={y(v)} width={bw} height={pad.t + innerH - y(v)} fill={accent} fillOpacity={hover === i ? 1 : 0.7} />;
        })}
        {style !== 'bar' && <path d={pathD} fill="none" stroke={accent} strokeWidth="1.75" strokeLinejoin="round" strokeLinecap="round" />}
        {/* labels */}
        {yTicks.map((t, i) => (
          <text key={i} x={pad.l - 8} y={y(t) + 4} fontSize="11" fontFamily="JetBrains Mono, monospace" fill="currentColor" fillOpacity="0.5" textAnchor="end">{formatValue(t)}</text>
        ))}
        {xTickIdx.map((i) => (
          <text key={i} x={x(i)} y={H - 6} fontSize="11" fontFamily="JetBrains Mono, monospace" fill="currentColor" fillOpacity="0.5" textAnchor={i === 0 ? 'start' : i === values.length - 1 ? 'end' : 'middle'}>
            {fmtDateShort(dates[i])}
          </text>
        ))}
        {/* hover */}
        {hover != null && (
          <g>
            <line x1={x(hover)} x2={x(hover)} y1={pad.t} y2={pad.t + innerH} stroke="currentColor" strokeOpacity="0.4" strokeWidth="1" strokeDasharray="2 3" />
            <circle cx={x(hover)} cy={y(values[hover])} r="4.5" fill={accent} stroke="white" strokeWidth="2" />
          </g>
        )}
      </svg>
      {hover != null && (
        <div className="chart-tooltip" style={{ left: `${(x(hover) / W) * 100}%` }}>
          <div className="t-date">{fmtDate(dates[hover])}</div>
          <div className="t-val">{formatValue(values[hover])}</div>
        </div>
      )}
    </div>
  );
}

// ─────────────────────────────────────────────────────────────────────────
// Sparkline (no axes, no tooltip)
// ─────────────────────────────────────────────────────────────────────────
function Sparkline({ values, accent = '#000', height = 36, fill = true }) {
  const W = 200, H = height;
  if (!values || values.length === 0) return null;
  const min = Math.min(...values), max = Math.max(...values);
  const range = max - min || 1;
  const x = (i) => (i / (values.length - 1)) * W;
  const y = (v) => H - 2 - ((v - min) / range) * (H - 4);
  const d = values.map((v, i) => `${i === 0 ? 'M' : 'L'}${x(i).toFixed(2)},${y(v).toFixed(2)}`).join(' ');
  const areaD = d + ` L${W},${H} L0,${H} Z`;
  return (
    <svg viewBox={`0 0 ${W} ${H}`} preserveAspectRatio="none" style={{ width: '100%', height, display: 'block' }}>
      {fill && <path d={areaD} fill={accent} fillOpacity="0.12" />}
      <path d={d} fill="none" stroke={accent} strokeWidth="1.6" strokeLinejoin="round" />
    </svg>
  );
}

// ─────────────────────────────────────────────────────────────────────────
// Horizontal bar list
// ─────────────────────────────────────────────────────────────────────────
function HBarList({ items, accent = '#000', valueFormat = (v) => `${v}%`, max }) {
  const m = max ?? Math.max(...items.map(i => i.value));
  return (
    <ul className="hbar-list">
      {items.map((it, i) => (
        <li key={i} className="hbar-row">
          <span className="hbar-label">{it.label || it.bucket}</span>
          <span className="hbar-track">
            <span className="hbar-fill" style={{ width: `${(it.value / m) * 100}%`, background: accent }} />
          </span>
          <span className="hbar-val">{valueFormat(it.value)}</span>
        </li>
      ))}
    </ul>
  );
}

// ─────────────────────────────────────────────────────────────────────────
// Heatmap (best time to post — 7 days × 24 hours)
// ─────────────────────────────────────────────────────────────────────────
function Heatmap({ grid, accent = '#000', onCellHover }) {
  const days = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
  const max = Math.max(...grid.flat());
  const [hover, setHover] = React.useState(null);

  return (
    <div className="heatmap" onMouseLeave={() => setHover(null)}>
      <div className="hm-hours">
        {[0, 3, 6, 9, 12, 15, 18, 21].map(h => (
          <span key={h} style={{ left: `${(h / 24) * 100}%` }}>{h.toString().padStart(2, '0')}</span>
        ))}
      </div>
      <div className="hm-grid">
        {grid.map((row, d) => (
          <div key={d} className="hm-row">
            <span className="hm-day">{days[d]}</span>
            <div className="hm-cells">
              {row.map((v, h) => {
                const op = 0.04 + (v / max) * 0.96;
                return (
                  <div
                    key={h}
                    className={`hm-cell ${hover && hover.d === d && hover.h === h ? 'hover' : ''}`}
                    style={{ background: accent, opacity: op }}
                    onMouseEnter={() => setHover({ d, h, v })}
                    title={`${days[d]} ${h}:00 — engagement ${v}`}
                  />
                );
              })}
            </div>
          </div>
        ))}
      </div>
      {hover && (
        <div className="hm-readout">
          <span className="hm-readout-label">{days[hover.d]} · {hover.h.toString().padStart(2, '0')}:00</span>
          <span className="hm-readout-val">{hover.v} <em>engagement index</em></span>
        </div>
      )}
    </div>
  );
}

// ─────────────────────────────────────────────────────────────────────────
// Donut for gender split
// ─────────────────────────────────────────────────────────────────────────
function Donut({ items, accent = '#000' }) {
  const total = items.reduce((s, it) => s + it.value, 0);
  const R = 56, r = 38, C = 80;
  let a0 = -Math.PI / 2;
  const arcs = items.map((it, i) => {
    const a1 = a0 + (it.value / total) * Math.PI * 2;
    const large = a1 - a0 > Math.PI ? 1 : 0;
    const x0 = C + Math.cos(a0) * R, y0 = C + Math.sin(a0) * R;
    const x1 = C + Math.cos(a1) * R, y1 = C + Math.sin(a1) * R;
    const x2 = C + Math.cos(a1) * r, y2 = C + Math.sin(a1) * r;
    const x3 = C + Math.cos(a0) * r, y3 = C + Math.sin(a0) * r;
    const d = `M${x0},${y0} A${R},${R} 0 ${large} 1 ${x1},${y1} L${x2},${y2} A${r},${r} 0 ${large} 0 ${x3},${y3} Z`;
    const op = 1 - i * 0.35;
    a0 = a1;
    return { d, op, ...it };
  });
  return (
    <div className="donut-wrap">
      <svg viewBox="0 0 160 160" width="120" height="120" style={{ flexShrink: 0 }}>
        {arcs.map((a, i) => <path key={i} d={a.d} fill={accent} fillOpacity={a.op} />)}
      </svg>
      <ul className="donut-legend">
        {arcs.map((a, i) => (
          <li key={i}>
            <span className="donut-sw" style={{ background: accent, opacity: a.op }} />
            <span className="donut-lab">{a.label}</span>
            <span className="donut-pct">{a.value}%</span>
          </li>
        ))}
      </ul>
    </div>
  );
}

// expose
Object.assign(window, {
  LineChart, Sparkline, HBarList, Heatmap, Donut,
  fmt, fmtPct, fmtDate, fmtDateShort,
});

// ─────────────────────────────────────────────────────────────────────────
// Date Range Picker — preset chips + two-month calendar with custom range
// ─────────────────────────────────────────────────────────────────────────
function DateRangePicker({ range, onRangeChange, open, setOpen }) {
  const ref = React.useRef(null);
  React.useEffect(() => {
    if (!open) return;
    const onDoc = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    document.addEventListener('mousedown', onDoc);
    return () => document.removeEventListener('mousedown', onDoc);
  }, [open]);

  const fmtRange = () => {
    const s = new Date(range.start + 'T00:00:00Z');
    const e = new Date(range.end + 'T00:00:00Z');
    const opts = { month: 'short', day: 'numeric', year: 'numeric', timeZone: 'UTC' };
    return `${s.toLocaleDateString('en-US', opts)} → ${e.toLocaleDateString('en-US', opts)}`;
  };

  const presets = [
    { label: '7 d',  days: 7  },
    { label: '28 d', days: 28 },
    { label: '90 d', days: 90 },
    { label: '12 mo',days: 365},
  ];

  const setPreset = (days) => {
    const end = new Date('2026-05-18T00:00:00Z');
    const start = new Date(end.getTime() - (days - 1) * 86400000);
    onRangeChange({ start: start.toISOString().slice(0, 10), end: end.toISOString().slice(0, 10) });
  };

  const days = Math.round((new Date(range.end) - new Date(range.start)) / 86400000) + 1;

  return (
    <div className="drp" ref={ref}>
      <button className="drp-trigger" onClick={() => setOpen(o => !o)}>
        <svg width="14" height="14" viewBox="0 0 16 16"><rect x="2.5" y="3.5" width="11" height="10" rx="1" fill="none" stroke="currentColor" strokeWidth="1.3"/><path d="M2.5 6h11" stroke="currentColor" strokeWidth="1.3"/><path d="M5 2v3M11 2v3" stroke="currentColor" strokeWidth="1.3" strokeLinecap="round"/></svg>
          <span className="drp-text">{fmtRange()}</span>
          <span className="drp-days">{days} days</span>
      </button>
      {open && (
        <div className="drp-panel">
          <div className="drp-presets">
            {presets.map(p => (
              <button key={p.label} className={`drp-chip ${days === p.days ? 'on' : ''}`} onClick={() => setPreset(p.days)}>{p.label}</button>
            ))}
          </div>
          <div className="drp-cal">
            <CalendarMonth range={range} onRangeChange={onRangeChange} monthOffset={-1} />
            <CalendarMonth range={range} onRangeChange={onRangeChange} monthOffset={0} />
          </div>
          <div className="drp-footer">
            <div className="drp-inputs">
              <label>Start <input type="date" value={range.start} max={range.end} onChange={(e) => onRangeChange({ ...range, start: e.target.value })} /></label>
              <label>End   <input type="date" value={range.end}   min={range.start} max="2026-05-18" onChange={(e) => onRangeChange({ ...range, end: e.target.value })} /></label>
            </div>
            <button className="drp-apply" onClick={() => setOpen(false)}>Apply</button>
          </div>
        </div>
      )}
    </div>
  );
}

function CalendarMonth({ range, onRangeChange, monthOffset = 0 }) {
  const ref = new Date('2026-05-01T00:00:00Z');
  ref.setUTCMonth(ref.getUTCMonth() + monthOffset);
  const y = ref.getUTCFullYear(), m = ref.getUTCMonth();
  const first = new Date(Date.UTC(y, m, 1));
  const last = new Date(Date.UTC(y, m + 1, 0));
  const startDay = (first.getUTCDay() + 6) % 7; // Mon=0
  const daysInMonth = last.getUTCDate();
  const cells = [];
  for (let i = 0; i < startDay; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) cells.push(new Date(Date.UTC(y, m, d)));
  while (cells.length % 7) cells.push(null);

  const startD = new Date(range.start + 'T00:00:00Z');
  const endD   = new Date(range.end   + 'T00:00:00Z');
  const today  = new Date('2026-05-18T00:00:00Z');

  const onClick = (d) => {
    const iso = d.toISOString().slice(0, 10);
    if (d > today) return;
    // If single-date click, set start; if click after start, set end
    if (range.__pickStart || d < startD) {
      onRangeChange({ start: iso, end: range.end, __pickStart: false });
    } else if (d > endD || d.getTime() === startD.getTime()) {
      onRangeChange({ ...range, end: iso, __pickStart: true });
    } else {
      onRangeChange({ start: iso, end: range.end });
    }
  };

  return (
    <div className="cal-month">
      <div className="cal-title">{first.toLocaleDateString('en-US', { month: 'long', year: 'numeric', timeZone: 'UTC' })}</div>
      <div className="cal-dow">{['M','T','W','T','F','S','S'].map((d,i) => <span key={i}>{d}</span>)}</div>
      <div className="cal-grid">
        {cells.map((d, i) => {
          if (!d) return <span key={i} className="cal-empty" />;
          const inRange = d >= startD && d <= endD;
          const isStart = d.getTime() === startD.getTime();
          const isEnd   = d.getTime() === endD.getTime();
          const future  = d > today;
          return (
            <button key={i}
              className={`cal-day ${inRange ? 'in' : ''} ${isStart ? 'start' : ''} ${isEnd ? 'end' : ''} ${future ? 'future' : ''}`}
              disabled={future}
              onClick={() => onClick(d)}>
              {d.getUTCDate()}
            </button>
          );
        })}
      </div>
    </div>
  );
}

Object.assign(window, { Header });

<script type="text/babel" data-presets="react">
// Dashboard sections — hero, KPIs, panels, posts grid, modal

function sliceSeries(series, dates, range) {
  const startIdx = dates.indexOf(range.start);
  const endIdx = dates.indexOf(range.end);
  const s = startIdx === -1 ? 0 : startIdx;
  const e = endIdx === -1 ? dates.length - 1 : endIdx;
  return {
    values: series.slice(s, e + 1),
    dates: dates.slice(s, e + 1),
  };
}

const sum = (arr) => arr.reduce((s, v) => s + v, 0);
const delta = (curr, prev) => {
  if (!prev) return 0;
  return ((curr - prev) / prev) * 100;
};

// ─────────────────────────────────────────────────────────────────────────
// Hero — big lede, profile bio, headline metric
// ─────────────────────────────────────────────────────────────────────────
function Hero({ profile, range, dates, accent, onMetricClick, chartStyle }) {
  const followers = sliceSeries(profile.series.followers, dates, range);
  const curr = followers.values[followers.values.length - 1] || 0;
  const start = followers.values[0] || 0;
  const change = curr - start;
  const pct = delta(curr, start);

  // Compare window — same length immediately before
  const days = followers.values.length;
  const startIdx = Math.max(0, dates.indexOf(range.start));
  const prevWindow = profile.series.followers.slice(Math.max(0, startIdx - days), startIdx);
  const prevChange = (prevWindow[prevWindow.length - 1] || 0) - (prevWindow[0] || 0);

  return (
    <section className="hero">
      <div className="hero-left">
        <div className="hero-eyebrow">
          <span className="eb-dot" style={{ background: accent }} />
          <span>Profile Overview</span>
          <span className="eb-handle">{profile.handle}</span>
          {profile.verified && <span className="eb-verified" title="Verified">✓</span>}
        </div>
        <h1 className="hero-title">
          {profile.name}.
          <span className="hero-sub">{profile.bio}</span>
        </h1>
        <div className="hero-meta">
          <span><em>Based</em> {profile.location}</span>
          <span><em>Language</em> {profile.language}</span>
          <span><em>Posts</em> {fmt(profile.posts_total)}</span>
        </div>
      </div>

      <button className="hero-right" onClick={() => onMetricClick('followers')}>
        <div className="hero-r-top">
          <span className="hero-r-label">Followers</span>
          <span className="hero-r-period">{followers.values.length} days</span>
        </div>
        <div className="hero-r-value">
          {fmt(curr)}
        </div>
        <div className="hero-r-delta">
          <span className={`delta ${change >= 0 ? 'up' : 'down'}`}>
            {change >= 0 ? '↗' : '↘'} {fmt(Math.abs(change))} <em>({fmtPct(Math.abs(pct), 2)})</em>
          </span>
          <span className="hero-r-prev">
            vs. prev. period: {prevChange >= 0 ? '+' : ''}{fmt(prevChange)}
          </span>
        </div>
        <div className="hero-r-spark">
          <Sparkline values={followers.values} accent={accent} height={56} />
        </div>
        <div className="hero-r-cta">Open detail →</div>
      </button>
    </section>
  );
}

// ─────────────────────────────────────────────────────────────────────────
// KPI strip
// ─────────────────────────────────────────────────────────────────────────
function KpiStrip({ profile, range, dates, accent, onMetricClick }) {
  const kpis = [
    { key: 'reach',          label: 'Reach',          fmt: fmt },
    { key: 'impressions',    label: 'Impressions',    fmt: fmt },
    { key: 'engagement',     label: 'Engagement',     fmt: fmt, sub: 'interactions' },
    { key: 'profile_views',  label: 'Profile Visits', fmt: fmt },
    { key: 'website_clicks', label: 'Website Clicks', fmt: fmt },
  ];

  return (
    <section className="kpi-strip">
      {kpis.map((k) => {
        const slice = sliceSeries(profile.series[k.key], dates, range);
        const total = sum(slice.values);
        const half = Math.floor(slice.values.length / 2);
        const recent = sum(slice.values.slice(half));
        const prev = sum(slice.values.slice(0, half));
        const d = delta(recent, prev);
        return (
          <button key={k.key} className="kpi-card" onClick={() => onMetricClick(k.key)}>
            <div className="kpi-top">
              <span className="kpi-label">{k.label}</span>
              <span className={`kpi-delta ${d >= 0 ? 'up' : 'down'}`}>{d >= 0 ? '+' : ''}{fmtPct(d, 1)}</span>
            </div>
            <div className="kpi-value">{k.fmt(total)}</div>
            <div className="kpi-sub">total {k.sub || ''}</div>
            <div className="kpi-spark"><Sparkline values={slice.values} accent={accent} height={32} /></div>
          </button>
        );
      })}
    </section>
  );
}

// ─────────────────────────────────────────────────────────────────────────

      </div>
      <div className="panel-body">
        <div className="retention-stats">
          <div className="rs-row"><span>3s hook</span><strong>{curve[3]}%</strong></div>
          <div className="rs-row"><span>15s mid</span><strong>{curve[15]}%</strong></div>
          <div className="rs-row"><span>30s end</span><strong>{finalRetention}%</strong></div>
          <div className="rs-row"><span>vs. industry</span><strong className={finalRetention >= benchmark ? 'good' : 'warn'}>{finalRetention >= benchmark ? '+' : ''}{finalRetention - benchmark} pts</strong></div>
        </div>
        <LineChart values={curve} dates={labels} accent={accent} style={chartStyle} height={180} formatValue={(v) => `${Math.round(v)}%`} />
      </div>
    </section>
  );
}

function BestTimePanel({ profile, accent, data, onExpand }) {

  grid.forEach((row, d) => row.forEach((v, h) => { if (v > peak.v) peak = { v, d, h }; }));
  const days = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];

  return (
    <section className="panel panel-besttime">
      <div className="panel-head">
        <h2 className="panel-title">Best Time to Post</h2>
        <div className="panel-head-right">
          <span className="panel-sub">Engagement index by hour (local · CET)</span>
          <button className="icon-btn" onClick={onExpand} aria-label="Open detailed view" title="Open detailed view">
            <svg width="14" height="14" viewBox="0 0 16 16"><path d="M2 6V2h4M14 6V2h-4M2 10v4h4M14 10v4h-4" fill="none" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round"/></svg>
          </button>

        <Heatmap grid={grid} accent={accent} />
        <div className="bt-peak">
          <span className="bt-peak-label">Peak window</span>

    </section>

}

function TopPostsPanel({ profile, accent, data, onPostClick, range }) {
  const all = data.posts[profile.id] || [];
  const [filter, setFilter] = React.useState('all');
  const [sort, setSort] = React.useState('reach');
  // First: filter by date range (default to all dates if range missing)
  const inRange = range && range.start && range.end
    ? all.filter(p => p.date && p.date >= range.start && p.date <= range.end)
    : all;
  // Then: filter by type
  const filtered = filter === 'all' ? inRange : inRange.filter(p => p.type === filter);
  // Sort by chosen metric and cap at 24 for layout
  const sorted = [...filtered].sort((a, b) => b[sort] - a[sort]).slice(0, 24);

  const TypeIcon = ({ type }) => {
    if (type === 'reel') return <svg width="12" height="12" viewBox="0 0 16 16"><path d="M3 3h10v10H3z" fill="none" stroke="currentColor" strokeWidth="1.3"/><path d="M7 6l4 2-4 2z" fill="currentColor"/></svg>;
    if (type === 'carousel') return <svg width="12" height="12" viewBox="0 0 16 16"><rect x="5" y="3" width="9" height="9" fill="none" stroke="currentColor" strokeWidth="1.3"/><rect x="2" y="6" width="9" height="9" fill="none" stroke="currentColor" strokeWidth="1.3"/></svg>;
    return <svg width="12" height="12" viewBox="0 0 16 16"><rect x="2.5" y="2.5" width="11" height="11" fill="none" stroke="currentColor" strokeWidth="1.3"/><circle cx="6" cy="6" r="1" fill="currentColor"/><path d="M3 12l3-3 3 3 4-4" fill="none" stroke="currentColor" strokeWidth="1.3"/></svg>;
  };

  return (
    <section className="panel panel-top-posts">
      <div className="panel-head">
        <h2 className="panel-title">Top Posts <span className="panel-count" style={{ fontSize: '11px', color: 'var(--ink-3, #888)', fontWeight: 400, marginLeft: '8px' }}>{filtered.length} im Zeitraum</span></h2>
        <div className="post-controls">
          <div className="filter-chips">
            {[['all','All'],['image','Image'],['reel','Reel'],['carousel','Carousel']].map(([k,l]) => (
              <button key={k} className={`chip ${filter === k ? 'on' : ''}`} onClick={() => setFilter(k)}>{l}</button>
            ))}
          </div>
          <div className="sort-by">
            <span>Sort by</span>
            <select value={sort} onChange={(e) => setSort(e.target.value)}>
              <option value="reach">Reach</option>
              <option value="likes">Likes</option>
              <option value="comments">Comments</option>
              <option value="saves">Saves</option>
              <option value="shares">Shares</option>
            </select>
          </div>
        </div>
      </div>
      <div className="panel-body">
        <div className="posts-grid">
          {sorted.map((p, i) => (
            <div key={p.id} className="post-card">
              <button className="post-card-main" onClick={() => onPostClick(p)}>
                <div className={`pc-media ${p.thumbnail ? 'has-image' : ''}`} style={p.thumbnail
                  ? { backgroundImage: `url(${p.thumbnail})`, backgroundSize: 'cover', backgroundPosition: 'center', backgroundColor: p.swatch }
                  : { background: p.swatch }}>
                  <span className="pc-rank">{String(i + 1).padStart(2, '0')}</span>
                  <span className="pc-type"><TypeIcon type={p.type} /> {p.type}</span>
                  {p.type === 'reel' && <span className="pc-duration">{p.duration}s</span>}
                  {p.type === 'carousel' && <span className="pc-duration">{p.slides} slides</span>}
                </div>
                <div className="pc-body">
                  <div className="pc-date">{fmtDate(p.date)}</div>
                  <div className="pc-title">{p.title}</div>
                  <div className="pc-stats">
                    <span><em>Reach</em> {fmt(p.reach)}</span>
                    <span><em>Likes</em> {fmt(p.likes)}</span>
                    <span><em>Comm.</em> {fmt(p.comments)}</span>
                    <span><em>Saves</em> {fmt(p.saves)}</span>
                  </div>
                </div>
              </button>
              {p.url && (
                <a className="pc-ig" href={p.url} target="_blank" rel="noopener noreferrer" onClick={(e) => e.stopPropagation()} title="View on Instagram">
